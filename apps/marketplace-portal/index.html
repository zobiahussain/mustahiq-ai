<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Al-Khidmat Marketplace</title>
    <!-- Poppins for display/headings + Inter for body -- the same pair
         the staff portal (apps/main-portal) uses, so the two Al-Khidmat
         apps read as one product. Noto Nastaliq Urdu for Urdu
         headings/labels (the traditional script real Urdu publications
         use); Noto Sans Arabic as the plainer script inside the textarea
         someone types into, since Nastaliq's connected cursive is harder
         to edit live than to read. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
